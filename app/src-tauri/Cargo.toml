[package]
name = "meeting-app"
version = "0.3.0"
description = "Meeting — notepad de reunião com IA (cliente do meeting daemon)"
authors = ["Gabriel Craveiro"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "meeting_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# usado pelo `tauri dev` quando roda com custom protocol
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
